[package]
name = "pyusp"
version = "0.1.0"
edition = "2021"
description = "Uniscribe (usp10) step-by-step shaping tracer — babelsoft /api/opentype/shape compatible. Windows-only."
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
serde_json = "1"

[profile.dev]
opt-level = 1

[[bin]]
name = "pyusp"
path = "src/main.rs"

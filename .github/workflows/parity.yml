# parity.yml — cross-platform Wine Uniscribe parity (M1/M3).
#
# Proves that the port's bytes-mode shaping (usp_set_font_bytes + NULL hdc)
# is identical on every OS:
#   - Linux  : libwineusp.so  built natively (build_posix.sh) — test_posix runs
#   - macOS  : libwineusp.dylib built natively                    — test_posix runs
#   - Windows: mingw build of the same port sources               — test_posix runs
# Each job shapes tools/wine_usp/testdata/NotoSansMongolian-Regular.ttf with
# Mongolian "saikhan" and compares stage-for-stage against the committed
# Windows reference golden (noto-saikhan-windows-golden.json).
#
# The .so build job additionally validates build_posix.sh output exists.

name: parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/wine_usp/**"
      - "src/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/parity.yml"

jobs:
  posix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Build libwineusp (native)
        run: sh tools/wine_usp/port/build_posix.sh

      - name: Compile + run parity driver
        working-directory: tools/wine_usp/port
        run: |
          set -e
          CC="${CC:-cc}"
          # build test_posix from the port sources (no .so needed for the test)
          $CC -O2 -std=gnu11 -fPIC -fshort-wchar -I posix -I include -I src \
              test_posix.c \
              src/bidi.c src/bracket.c src/breaking.c src/direction.c \
              src/fontbytes.c src/indic.c src/indicsyllable.c src/linebreak.c \
              src/mirror.c src/opentype.c src/shape.c src/shaping.c src/trace.c \
              src/usp10.c posix/posix_compat.c \
              -lm -o build/test_posix
          ./build/test_posix ../testdata/NotoSansMongolian-Regular.ttf > build/trace.txt
          python3 ../compare_trace.py build/trace.txt ../testdata/noto-saikhan-windows-golden.json

  windows:
    name: windows (mingw)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2 (mingw-w64 gcc)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Compile + run parity driver (mingw)
        shell: msys2 {0}
        working-directory: tools/wine_usp/port
        run: |
          set -e
          mkdir -p build
          # real MinGW Windows headers (no posix shims); link gdi/user/kernel
          gcc -O2 -std=gnu11 -I include -I src \
              test_posix.c \
              src/bidi.c src/bracket.c src/breaking.c src/direction.c \
              src/fontbytes.c src/indic.c src/indicsyllable.c src/linebreak.c \
              src/mirror.c src/opentype.c src/shape.c src/shaping.c src/trace.c \
              src/usp10.c \
              -lgdi32 -luser32 -lkernel32 \
              -o build/test_posix.exe
          FONT="$(cygpath -w "$(pwd)/../testdata/NotoSansMongolian-Regular.ttf")"
          ./build/test_posix.exe "$FONT" > build/trace.txt

      # msys2 has no python; run the checker with the runner's Windows python.
      - name: Compare vs Windows golden
        working-directory: tools/wine_usp/port
        run: python ../compare_trace.py build/trace.txt ../testdata/noto-saikhan-windows-golden.json

  # Build the native abi3 wheel (with the bundled libwineusp) and run the
  # installed-wheel python-level parity: pyusp.shape_with_uniscribe on
  # Linux/macOS must reproduce the Windows golden trace exactly.
  wheel:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build libwineusp (native)
        run: sh tools/wine_usp/port/build_posix.sh

      - name: Bundle libwineusp into the package dir
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            cp tools/wine_usp/port/libwineusp.dylib python/pyusp-wheel/python/pyusp/
          else
            cp tools/wine_usp/port/libwineusp.so python/pyusp-wheel/python/pyusp/
          fi

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build wheel
        working-directory: python/pyusp-wheel
        run: python -m maturin build --release -o dist

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps python/pyusp-wheel/dist/*.whl

      - name: Python parity check (installed wheel)
        run: python tools/wine_usp/check_wheel_parity.py

  # Debug job: reproduce the Linux glibc heap corruption ("corrupted size vs.
  # prev_size" after a correct PARITY_MATCH) under AddressSanitizer. The
  # libwineusp .so is compiled with -fsanitize=address and preloaded so any
  # invalid write/read inside the port is reported with a C stack trace.
  debug-asan:
    name: debug (ubuntu, ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build libwineusp with AddressSanitizer
        env:
          EXTRA_CFLAGS: "-fsanitize=address -g -O1"
          EXTRA_LDFLAGS: "-fsanitize=address"
          OUT_NAME: "libwineusp_asan"
        run: sh tools/wine_usp/port/build_posix.sh

      - name: Bundle the ASan lib as libwineusp.so
        run: cp tools/wine_usp/port/libwineusp_asan.so python/pyusp-wheel/python/pyusp/libwineusp.so

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build wheel
        working-directory: python/pyusp-wheel
        run: python -m maturin build --release -o dist

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps python/pyusp-wheel/dist/*.whl

      - name: Run parity under ASan
        env:
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:handle_segv=1"
        run: |
          LIBA="$(cc -print-file-name=libasan.so)"
          LD_PRELOAD="$LIBA" python tools/wine_usp/check_wheel_parity.py

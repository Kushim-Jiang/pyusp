[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pyusp"
version = "0.1.0"
description = "Uniscribe (usp10) OpenType shaping tracer (babelsoft /api/opentype/shape compatible). WINDOWS ONLY."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kushim-Jiang", email = "kushim_jiang@outlook.com" },
]
keywords = ["uniscribe", "usp10", "opentype", "shaping", "trace", "babelmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Fonts",
]

[project.urls]
Homepage = "https://github.com/Kushim-Jiang/pyusp"
Source = "https://github.com/Kushim-Jiang/pyusp"
"Bug Tracker" = "https://github.com/Kushim-Jiang/pyusp/issues"

[tool.maturin]
module-name = "pyusp._pyusp"
python-source = "python"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# What gets bundled into the wheel at pyusp/:
#   wineusp.dll  - Wine's open-source Uniscribe port (LGPL), built from
#                  tools/wine_usp/port; the redistributable per-lookup engine.
#   usp10.dll    - Microsoft's OS component, NOT redistributable. Copied from
#                  System32 only for local dev/test (git-ignored, build_wheel.ps1).
#                  The glob below lets a PUBLISH build omit it (delete the file):
#                  the wheel then ships only wineusp.dll and the engine falls
#                  back to the system usp10.dll at runtime.
#   NOTICE*.md   - component notices (see python/pyusp/NOTICE*.md).
include = [
    "pyusp/*.dll",
    "pyusp/NOTICE.md",
    "pyusp/NOTICE-wineusp.md",
]

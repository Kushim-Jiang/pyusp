[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pyusp"
version = "0.2.0"
description = "Uniscribe (usp10) OpenType shaping tracer (babelsoft /api/opentype/shape compatible). WINDOWS ONLY."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kushim-Jiang", email = "kushim_jiang@outlook.com" },
]
keywords = ["uniscribe", "usp10", "opentype", "shaping", "trace", "babelmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Fonts",
]

[project.urls]
Homepage = "https://github.com/Kushim-Jiang/pyusp"
Source = "https://github.com/Kushim-Jiang/pyusp"
"Bug Tracker" = "https://github.com/Kushim-Jiang/pyusp/issues"

[tool.maturin]
module-name = "pyusp._pyusp"
python-source = "python"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# What gets bundled into the wheel at pyusp/:
#   wineusp.dll    - Wine's open-source Uniscribe port (LGPL), built from
#                    tools/wine_usp/port; the redistributable per-lookup engine.
#   NOTICE*.md     - component notices (see python/pyusp/NOTICE*.md).
# The Microsoft usp10.dll is NOT redistributable and must not ship in a wheel.
# maturin auto-includes every file present in python/pyusp/, so to build a
# publish wheel you must build with python/pyusp/usp10.dll absent (it is
# git-ignored and copied from System32 only by the dev-only build_wheel.ps1,
# which intentionally produces a local dev/test wheel). At runtime the engine
# falls back to the system usp10.dll when none is bundled.
include = [
    "pyusp/wineusp.dll",
    "pyusp/NOTICE.md",
    "pyusp/NOTICE-wineusp.md",
    "pyusp/NOTICE-native-trace.md",
]
